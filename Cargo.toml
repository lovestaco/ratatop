[package]
name = "ratatop"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A btop-style resource monitor built on ratatui"
license = "Apache-2.0"

[dependencies]
ratatui = "0.30"
# Filesystem usage has no /proc equivalent; statvfs(2) is the only way to get it.
libc = "0.2"

[profile.release]
lto = true
strip = true
